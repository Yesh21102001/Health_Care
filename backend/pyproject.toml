[project]
name = "healthai-backend"
version = "0.1.0"
description = "HealthAI API (FastAPI + MongoDB)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run, so the shared MongoDB client stays valid.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:pymongo_inmemory.*"]

[pymongo_inmemory]
mongo_version = "8.0"
